services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://aegis:aegis_change_me@db:5432/aegis
      DEMO_MODE: "1"
      CORS_ORIGINS: "*"
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_change_me
      POSTGRES_DB: aegis
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
volumes:
  pgdata:
